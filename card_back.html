<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trick Card Back</title>
<link rel="stylesheet" href="./card_base.css" />
<link rel="stylesheet" href="./deck_cards.css" />
</head>
<body>
  <div class="card-preview">
    <div class="card card-back" aria-label="Trick card back">
      <div class="card-back__field"></div>
      <div class="card-back__medallion" aria-hidden="true">
        <div class="card-back__icon card-back__icon--strength"></div>
        <div class="card-back__icon card-back__icon--dexterity"></div>
        <div class="card-back__icon card-back__icon--intelligence"></div>
        <div class="card-back__icon card-back__icon--weird"></div>
        <div class="card-back__center"></div>
      </div>
    </div>
  </div>
  <script src="./suit_icons.js"></script>
  <script>
    for (const suit of ["strength", "dexterity", "intelligence", "weird"]) {
      document.querySelector(`.card-back__icon--${suit}`).innerHTML = globalThis.TrickSuitIcons.svg(suit);
    }
    if (new URLSearchParams(window.location.search).get("export") === "1") {
      document.body.classList.add("export-page");
    }
  </script>
</body>
</html>
