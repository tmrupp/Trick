<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRICK · Host</title>
<link rel="stylesheet" href="/shared/style.css">
</head>
<body>
<header class="phone-head"><h1 id="title">TRICK · Host</h1><span id="status" class="dot" data-tip="Connecting…"></span><span id="tools"></span></header>
<main>
<p class="muted small">Keep this page's address private: it opens campaigns and shows each GM link.</p>
<div id="error" class="panel banner bad" hidden></div>
<div class="panel stack">
  <h2>New campaign</h2>
  <form id="create" class="row">
    <input id="name" placeholder="Campaign name" required maxlength="60" aria-label="Campaign name">
    <button class="primary">Create and open</button>
    <span class="small muted">or</span>
    <button type="button" id="import-button" data-tip="Open a save you downloaded from this page.">Import a save…</button>
    <input type="file" id="import" accept="application/json,.json" hidden>
  </form>
</div>
<div id="open"></div>
<div class="panel stack"><h2>Saved campaigns</h2><div id="saved"></div></div>
</main>
<script type="module">
import { h, params, render, confirmButton, setRedraw, mountHeader, presence } from "/shared/client.js";
const header = mountHeader({ tip: "Rules and sound." });
const admin = params.get("admin");
const api = async (path, body, method) => {
  const r = await fetch(path, { method: method || (body ? "POST" : "GET"), headers: { "x-admin": admin, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || "Request failed");
  return data;
};
const err = document.getElementById("error");
const show = (e) => { err.hidden = false; err.textContent = e.message; };
const qrCache = new Map();

async function download(id, name) {
  const data = await api(`/api/export?id=${encodeURIComponent(id)}`);
  const a = h("a", { href: URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" })), download: `${id}.json` });
  document.body.append(a); a.click(); a.remove();
}

let lastInfo = null;
setRedraw(() => lastInfo && renderInfo(lastInfo));
const closeCampaign = (id) => api("/api/close", { id }).then(renderInfo).catch(show);

function renderInfo(info) {
  lastInfo = info;
  err.hidden = true;
  render(document.getElementById("open"), info.rooms.map((r) => {
    const join = `${info.publicUrl}/j/${r.code}`;
    const gm = `${info.publicUrl}/gm?room=${r.code}&key=${encodeURIComponent(r.gmKey)}`;
    const qr = h("div", { class: "qr" });
    if (qrCache.has(join)) qr.innerHTML = qrCache.get(join);
    else fetch(`/qr.svg?text=${encodeURIComponent(join)}`).then((x) => x.text()).then((svg) => { qrCache.set(join, svg); qr.innerHTML = svg; });
    return h("div", { class: "panel stack" },
      h("div", { class: "headrow" }, h("h2", {}, r.name),
        confirmButton(`close-${r.id}`, "Close campaign", `Yes, close ${r.name}`, () => closeCampaign(r.id), "Disconnects its screens, which stay out until you open it again. The save stays.")),
      h("div", { class: "row align-start-wide" }, qr,
        h("div", { class: "stack" },
          h("div", {}, h("div", { class: "muted small" }, "Room code"), h("div", { class: "code" }, r.code)),
          h("div", {}, "Players join at ", h("a", { href: join, target: "_blank" }, join)),
          h("div", { class: "row" }, h("a", { href: `/table?room=${r.code}`, target: "_blank" }, "Table screen"), "·", h("a", { href: gm, target: "_blank" }, "GM controls"), "·", h("a", { href: `${info.publicUrl}/watch?room=${r.code}`, target: "_blank" }, "Spectator link")),
          h("div", { class: "row small" }, h("span", { class: "muted" }, "GM link (secret):"), h("code", {}, gm.replace(/^https?:\/\//, "")), h("button", { class: "small", onclick: () => navigator.clipboard.writeText(gm).then(() => {}, () => {}) }, "Copy")))),
      h("h3", {}, "Seats"),
      r.seats.length ? h("div", { class: "row" }, r.seats.map((s) => h("span", { class: "pill" }, `${s.role === "gm" && s.name !== "GM" ? `${s.name} (GM)` : s.name}${s.role === "player" && !s.charId ? " · no character" : ""} `, presence(s)))) : h("p", { class: "muted" }, "Nobody has joined yet."));
  }));
  const openIds = new Set(info.rooms.map((r) => r.id));
  render(document.getElementById("saved"), info.campaigns.length ? h("div", { class: "scroll" }, h("table", { class: "saved" }, h("tbody", {}, info.campaigns.map((c) =>
    h("tr", {}, h("td", {}, h("strong", {}, c.name), h("div", { class: "muted small" }, c.characters.join(", ") || "No characters yet")),
      h("td", { class: "muted small" }, new Date(c.updatedAt).toLocaleString()),
      h("td", {}, h("div", { class: "row" },
        openIds.has(c.id) ? [h("span", { class: "pill good" }, "Open"), h("button", { class: "small ghost", "data-tip": "Disconnects its screens, which stay out until you open it again. The save stays.", onclick: () => closeCampaign(c.id) }, "Close")]
          : h("button", { class: "small primary", onclick: () => api("/api/open", { id: c.id }).then(renderInfo).catch(show) }, "Open"),
        h("button", { class: "small", onclick: () => download(c.id, c.name).catch(show) }, "Download"),
        confirmButton(`archive-${c.id}`, "Archive", `Yes, archive ${c.name}`, () => api("/api/archive", { id: c.id }).then(renderInfo).catch(show), "Closes the room and moves the save to saves/archive.")))))))) : h("p", { class: "muted" }, "No saved campaigns yet."));
}

document.getElementById("create").addEventListener("submit", (e) => {
  e.preventDefault();
  api("/api/campaigns", { name: document.getElementById("name").value }).then((info) => { document.getElementById("name").value = ""; renderInfo(info); }).catch(show);
});
document.getElementById("import-button").addEventListener("click", () => document.getElementById("import").click());
document.getElementById("import").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try { renderInfo(await api("/api/import", JSON.parse(await file.text()))); } catch (x) { show(x); }
  e.target.value = "";
});
const refresh = () => api("/api/info").then((info) => { header.setStatus("connected"); renderInfo(info); }).catch((e) => { header.setStatus("offline"); show(e); });
refresh();
setInterval(refresh, 4000);
</script>
</body>
</html>
