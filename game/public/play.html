<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f4a3c">
<title>TRICK</title>
<link rel="stylesheet" href="/shared/style.css">
<script src="/suit_icons.js"></script>
<script src="/card_rules.js"></script>
<script src="/items/item_catalog.js"></script>
<script src="/races/race_catalog.js"></script>
</head>
<body>
<header class="phone-head">
  <h1 id="title">TRICK</h1>
  <span id="status" class="dot" data-tip="Connecting…"></span>
  <span id="tools"></span>
</header>
<main id="main" aria-live="polite"></main>
<script type="module">
import { connect, params, h, render, forget, cardFace, cardText, SUITS, RESULT, RESULT_NOTE, trickSentence, eventText, toast, chime, buzz, hasToken, itemsById, racesById, stripTags, difficultyHint, draft, menu, zoomCard, cardFromLabel, markSuits, mountHeader, setRedraw, announce, trickLog, handDock, consolationText, choosingList, layoutSwitch, notesPanel, suitChoice, picked, setPicked, tone, resultPill, historyPanel, inPlayPills, segmented } from "/shared/client.js";

const main = document.getElementById("main");
const ITEMS = itemsById();
const RACES = racesById();
const ITEM_NAMES = Object.fromEntries(Object.entries(ITEMS).map(([k, v]) => [k, v.label]));
let room = (params.get("room") || "").toUpperCase();
let conn = null;
let last = null;
let tab = "play"; // play | cards | history
let ui = { chosen: null, price: null, info: false, creating: false };
let lastTrickSeen = null; // the newest trick this phone has shown; null until the first view
let lastPromptKey = "";
const GUIDE_KEY = "trick:guide-seen";

// The shared header: the room name, the connection dot, and one menu with this page's own items.
const layout = layoutSwitch("play");
const notes = notesPanel({ send: (op) => conn && conn.manage(op) });
const header = mountHeader({ tip: "Your cards, the guide, rules and sound.", items: () => [
  layout.item(),
  { label: tab === "cards" ? "Back to the check" : "My cards and characters", onclick: () => { tab = tab === "cards" ? "play" : "cards"; draw(); } },
  { label: "How to play a trick", tip: "A three-step reminder of how a trick works.", onclick: () => showGuide(0) },
  notes.item(),
] });
const setStatus = header.setStatus;
setRedraw(() => draw());

// ---- First-time guide: three steps, shown once, and again from the menu ----
function showGuide(step = 0) {
  document.querySelectorAll(".guide").forEach((g) => g.remove());
  const me = last && last.room.you.charId;
  const p = last && last.view.check && last.view.check.players && last.view.check.players[me];
  const trump = p && p.approach ? `${SUITS[p.approach].sym} ${SUITS[p.approach].name}` : "your goal's suit";
  const steps = [
    ["The world card", "Each trick, the world leads one card, shown big at the top. Everyone picks a card from their hand at the same time, face down."],
    ["Beat it to win it", `Your card wins if it's the single highest card and it's in the world card's suit or your trump (${trump}). Losing isn't wasted: your losing card's suit gives you a consolation for the next trick.`],
    ["Hit your target exactly", "A world card you win scores its value. Land on your target exactly for a critical; a little short is still a success. Going over is a bust."],
  ];
  const [title, text] = steps[step];
  const close = () => { box.remove(); try { localStorage.setItem(GUIDE_KEY, "1"); } catch {} };
  const box = h("div", { class: "guide", role: "dialog", "aria-label": "How to play a trick" },
    h("div", { class: "guide-card stack" },
      h("div", { class: "guide-steps", "aria-hidden": "true" }, steps.map((_, i) => h("span", { class: i <= step ? "on" : "" }))),
      h("h2", {}, title), h("p", {}, text),
      h("div", { class: "row" },
        step < steps.length - 1 ? h("button", { class: "primary", onclick: () => showGuide(step + 1) }, "Next") : h("button", { class: "primary", onclick: close }, "Got it"),
        h("button", { class: "ghost", onclick: close }, step < steps.length - 1 ? "Skip" : "Close"),
        h("span", { class: "small muted" }, "Hold any card to see it full size."))));
  document.body.append(box);
}
const guideSeen = () => { try { return localStorage.getItem(GUIDE_KEY) === "1"; } catch { return true; } };

// ---- The phone's own reveal: what just happened to you, for a moment ----
let revealTimer = null;
function showReveal(e, view, me, names) {
  document.querySelectorAll(".phone-reveal").forEach((x) => x.remove());
  const mine = e.plays.find((x) => x.id === me);
  const world = view.check.worldRow[e.trick];
  const p = view.check.players[me];
  const last = e.trick === view.check.tricks - 1;
  const won = e.winner === me;
  const headline = won ? `You take the ${e.worldLabel}` : e.winner ? `${names[e.winner]} takes the ${e.worldLabel}` : `The world keeps the ${e.worldLabel}`;
  const card = mine && cardFromLabel(mine.label);
  let after = "";
  if (won) after = `+${e.score}: you're on ${p.total} of ${p.target}.`;
  else if (mine && !last && card && !card.blessed) {
    after = { S: `Brace +${card.v} on your next card.`, D: "Peek: choose below whether to replace the next world card.", I: "Recalculate: choose a card to swap below.", W: "Mirror: your next card counts 11 minus its value." }[card.suit] || "";
  }
  const box = h("div", { class: `phone-reveal${won ? " won" : ""}`, role: "status", onclick: () => box.remove() },
    h("div", { class: "small muted" }, `Trick ${e.trick + 1}`),
    h("div", { class: "cards" }, world ? cardFace(world, "md") : null, h("span", { class: "vs" }, mine ? "vs" : ""), card ? cardFace(card, "md", { class: won ? "chosen" : "" }) : null),
    h("div", { class: "headline" }, headline),
    after ? h("p", { class: "note-gap" }, after) : null,
    h("p", { class: "small muted note-gap" }, trickSentence(e, names)), h("div", { class: "peek-slot small muted" }));
  document.body.append(markSuits(box));
  if (won) buzz([60, 40, 90]); else buzz(30);
  clearTimeout(revealTimer);
  revealTimer = setTimeout(() => box.remove(), 3200);
}

function askRoom() {
  const input = h("input", { placeholder: "Room code", maxlength: 8, autocapitalize: "characters", autocomplete: "off", "aria-label": "Room code" });
  main.replaceChildren(h("form", { class: "panel stack", onsubmit: (e) => { e.preventDefault(); room = input.value.trim().toUpperCase(); history.replaceState(null, "", `?room=${room}`); start(); } },
    h("h2", {}, "Join a game"), h("p", { class: "muted" }, "Enter the code on the table screen, or scan its QR code."), input, h("button", { class: "primary big" }, "Next")));
  input.focus();
}

function askName() {
  const input = h("input", { placeholder: "Your name", maxlength: 24, required: true, autocomplete: "nickname", "aria-label": "Your name" });
  const back = h("div", { class: "stack" });
  main.replaceChildren(
    h("form", { class: "panel stack", onsubmit: (e) => { e.preventDefault(); go(input.value.trim()); } },
      h("h2", {}, `Join room ${room}`), h("p", { class: "muted" }, "New here? Enter your name."), input, h("button", { class: "primary big" }, "Join")),
    back);
  // Returning on a new browser or a new link: offer the characters nobody is playing right now.
  fetch(`/api/rooms/${encodeURIComponent(room)}/returning`).then((r) => r.json()).then((d) => {
    if (!d.returning || !d.returning.length) return;
    back.replaceChildren(h("div", { class: "panel stack" }, h("h2", {}, "Coming back?"), h("p", { class: "muted" }, "Tap your character to pick up where you left off."),
      d.returning.map((r) => h("button", { class: "big", onclick: () => go(null, r.seatId) }, r.character, r.name && r.name !== r.character ? h("span", { class: "small muted" }, ` (${r.name})`) : null))));
  }).catch(() => {});
  input.focus();
}

function go(name, reclaim) {
  conn = connect({
    room, as: "player", getName: () => name, reclaim, fresh: !!(name || reclaim),
    onStatus: setStatus,
    onView: (msg) => { last = msg; react(msg); draw(); },
    onNotes: (n) => notes.receive(n),
    onRejected: (reason) => { toast(reason); buzz(120); },
    onError: (reason) => {
      // A saved seat this room doesn't know (or one someone else took back): start over at the join screen.
      // Your seat is open in another tab: join here as someone else, or take back a character nobody is playing.
      if (/another tab/.test(reason)) { conn.stop(); toast("Your seat is open in another tab. Join here as someone else, or pick a character under Coming back."); return askName(); }
      if (/Enter your name|already connected/.test(reason)) { conn.forget(); conn.stop(); toast(reason === "Enter your name to join." ? "Join again: your old seat isn't in this room." : reason); return askName(); }
      toast(reason);
      if (/No room|removed/.test(reason)) main.replaceChildren(h("div", { class: "panel banner bad" }, h("h2", {}, "Can't join"), h("p", {}, reason), h("p", { class: "muted" }, "Check the code with the GM.")));
    },
  });
}

function start() { if (!room) return askRoom(); if (hasToken(room, "player")) go(); else askName(); }
const act = (a) => conn.act(a);

// Sounds, buzzes and toasts for what just happened.
function react(msg) {
  const view = msg.view;
  const names = Object.fromEntries(Object.values(view.characters).map((c) => [c.id, c.name]));
  announce(msg.events, names, ITEM_NAMES, 4500);
  const ck = view.check;
  const me = msg.room.you.charId;
  const newest = ck && ck.phase !== "closed" ? ck.log.length - 1 : -1;
  if (lastTrickSeen !== null && newest > lastTrickSeen && ck.players[me]) { chime("reveal"); showReveal(ck.log[newest], view, me, names); }
  lastTrickSeen = newest;
  if (ck && ck.phase === "play" && ck.players[me] && !guideSeen() && !document.querySelector(".guide")) showGuide(0);
  const promptKey = (view.prompts || []).map((p) => p.type).join(",");
  if (promptKey && promptKey !== lastPromptKey) { chime("turn"); buzz(); }
  lastPromptKey = promptKey;
}

// ---- Character creation ----

function createForm(you) {
  const another = !!you.charId;
  const name = h("input", { "data-key": "c-name", value: another ? "" : you.name, placeholder: "Character name", maxlength: 24, "aria-label": "Character name" });
  // Suits as buttons: picking one redraws the form, and the secondary skips the primary.
  const primary = picked("c-prim", "S");
  let secondary = picked("c-sec", "D");
  if (secondary === primary) secondary = Object.keys(SUITS).find((s) => s !== primary);
  const rest = Object.keys(SUITS).filter((s) => s !== primary && s !== secondary);
  const other = rest.includes(picked("c-other")) ? picked("c-other") : rest[0];
  const race = h("select", { "data-key": "c-race", "aria-label": "People" }, h("option", { value: "" }, "Human (no people's ability)"), Object.values(RACES).map((r) => h("option", { value: r.id }, r.label || r.name)));
  const raceInfo = h("p", { class: "small muted" });
  const refresh = () => {
    const r = RACES[race.value];
    raceInfo.textContent = r ? `${r.abilityTitle || ""}: ${(r.rules || []).map(stripTags).join(" ")}` : "";
  };
  race.onchange = refresh;
  queueMicrotask(refresh);
  return h("form", { class: "panel stack", onsubmit: (e) => {
      e.preventDefault();
      if (another && !name.value.trim()) return toast("Name your new character.");
      act({ type: "createCharacter", name: name.value, primary, secondary, others: [other, rest.find((s) => s !== other)], race: race.value || null });
      ui.creating = false;
    } },
    h("h2", {}, another ? "New character" : "Create your character"),
    another ? h("p", { class: "small muted" }, "Your other characters stay in the campaign; you can switch back between checks.") : null,
    h("label", {}, "Name ", name),
    h("div", { class: "stack-tight" }, h("span", {}, "Primary suit"), suitChoice("c-prim", primary, null, "Primary suit"), h("div", { class: "small muted" }, "A, 2, 4, 5, 7, 8, 10: your strongest suit.")),
    h("div", { class: "stack-tight" }, h("span", {}, "Secondary suit"), suitChoice("c-sec", secondary, (k) => { setPicked("c-sec", k); draw(); }, "Secondary suit", { exclude: [primary] }), h("div", { class: "small muted" }, "A, 3, 6, 9, 10.")),
    h("div", { class: "stack-tight" }, h("span", {}, "Which takes 2, 3, 6, 9?"), segmented("c-other", rest.map((s) => [s, `${SUITS[s].sym} ${SUITS[s].name}`]), other, (k) => { setPicked("c-other", k); draw(); }, "Which suit takes 2, 3, 6, 9"), h("div", { class: "small muted" }, "The other takes 4, 5, 7, 8.")),
    h("label", {}, "People ", race), raceInfo,
    h("button", { class: "primary big" }, "Create"),
    another ? h("button", { type: "button", class: "ghost", onclick: () => { ui.creating = false; draw(); } }, "Cancel") : null);
}

// Your characters: switch between them between checks, or start a new one.
function charactersPanel(info, view, me, busy) {
  const mine = (info.you.chars || [me]).filter((id) => view.characters[id]);
  return h("div", { class: "panel stack" }, h("h2", {}, mine.length > 1 ? "Your characters" : "Your character"),
    mine.map((id) => {
      const c = view.characters[id];
      return h("div", { class: "spread" }, h("span", {}, h("strong", {}, c.name), c.alive ? "" : h("span", { class: "pill bad ml" }, "dead"), c.retired ? h("span", { class: "pill warn ml" }, "retired") : ""),
        id === me ? h("span", { class: "pill good" }, "playing") : h("button", { class: "small", disabled: busy, onclick: () => conn.manage({ op: "switch", charId: id }) }, "Play as"));
    }),
    busy ? h("p", { class: "small muted" }, "You can switch or start a new character once this check ends.")
      : h("button", { onclick: () => { ui.creating = true; draw(); } }, "New character"));
}

// ---- My cards ----

function sheet(view, me) {
  const ch = view.characters[me];
  const race = ch.race && RACES[ch.race];
  return h("div", { class: "sheet" },
    h("div", { class: "panel stack" },
      h("h2", {}, ch.name), race ? h("p", {}, h("strong", {}, `${race.label || race.name}: ${race.abilityTitle || ""}`), h("br"), h("span", { class: "small" }, (race.rules || []).map(stripTags).join(" "))) : null,
      ch.compulsion.length ? h("p", { class: "banner panel warn" }, h("strong", {}, "Curse compulsion: "), ch.compulsion.join("; ")) : null,
      ch.survival ? h("p", { class: "banner panel bad" }, h("strong", {}, "Survival: "), `${ch.survival.M} Injuries near the top of your discard. Your next check's goal is to survive, target ${ch.survival.target}.`) : null,
      inPlayPills(ch, (k) => cardText(k === "B" ? { blessed: true } : { suit: k, status: true }))),
    ch.items.length ? h("div", { class: "panel stack" }, h("h2", {}, "Items"), ch.items.map((id) => {
      const it = ITEMS[id];
      return h("details", {}, h("summary", {}, it ? it.label : id),
        it ? h("div", { class: "small", html: (it.lines || []).join("<br>") }) : null,
        h("button", { class: "small", onclick: () => act({ type: "useItem", charId: me, itemId: id }) }, "Use it (tell the table)"));
    })) : null,
    h("div", { class: "panel" }, h("h2", {}, `Deck (${ch.deckCount})`), h("div", { class: "row" }, (ch.deckCards || []).map((c) => cardFace(c, "sm")))),
    h("div", { class: "panel" }, h("h2", {}, `Discard (${ch.discardCount})`), h("p", { class: "small muted" }, "Top card last."), h("div", { class: "row" }, (ch.discard || []).map((c) => cardFace(c, "sm")))),
    h("p", {}, h("a", { href: `/print?room=${room}`, target: "_blank" }, "Print my current cards")));
}

// ---- Prompts ----

function promptPanel(pr, view, me) {
  const ck = view.check;
  if (pr.type === "peek") {
    const next = ck.worldRow[ck.trick];
    return h("div", { class: "panel banner stack" }, h("h2", {}, "Peek"),
      h("p", {}, "You lost with a Dexterity card. Replace the next world card with the top of the world deck? Nobody sees the new card until it lands."),
      h("div", { class: "row align-end" }, cardFace(next, "lg"), h("div", { class: "small muted narrow-note" }, "If anyone who lost with a Dexterity card chooses Replace, it's replaced once. Nobody sees who chose what.")),
      h("div", { class: "row" },
        h("button", { class: "primary big", onclick: () => act({ type: "peek", charId: me, replace: true }) }, "Replace it"),
        h("button", { class: "big", onclick: () => act({ type: "peek", charId: me, replace: false }) }, "Keep it")));
  }
  if (pr.type === "recalculate") {
    return h("div", { class: "panel banner stack" }, h("h2", {}, "Recalculate"), h("p", {}, "You lost with an Intelligence card. Tap a card to discard; you'll draw one to replace it."),
      h("div", { class: "hand" }, view.hand.map((c) => cardFace(c, "md", { onclick: () => act({ type: "recalculate", charId: me, cardId: c.id }) }))));
  }
  if (pr.type === "evolve") {
    const discard = view.characters[me].discard;
    const suit = h("select", { "data-key": "ev-suit", "aria-label": "Status to evolve" }, pr.suits.map((s) => h("option", { value: s }, `${SUITS[s].status} (${SUITS[s].name})`)));
    const card = h("select", { "data-key": "ev-card", "aria-label": "Card to return" }, discard.filter((c) => !c.status && !c.blessed).map((c) => h("option", { value: c.id }, c.label)));
    return h("div", { class: "panel banner stack" }, h("h2", {}, "Evolve?"),
      h("p", {}, "Your deck is reshuffling, and your discard holds two matching statuses. You may return one of them to your reserve, then either gain a card of that suit (choose one of three) or return one of that suit's cards from your discard."),
      h("label", {}, "Status ", suit),
      h("button", { onclick: () => act({ type: "evolve", charId: me, suit: suit.value, mode: "gain" }) }, "Return one and gain a card"),
      h("div", { class: "row" }, card, h("button", { onclick: () => act({ type: "evolve", charId: me, suit: suit.value, mode: "return", cardId: card.value }) }, "Return one and this card")),
      h("button", { class: "ghost", onclick: () => act({ type: "evolve", charId: me, skip: true }) }, "Don't evolve"));
  }
  if (pr.type === "evolvePick") {
    return h("div", { class: "panel banner stack" }, h("h2", {}, "Keep one"), h("p", {}, "It goes into your discard; the others return to reserve."),
      h("div", { class: "hand" }, pr.options.map((c) => cardFace(c, "lg", { onclick: () => act({ type: "evolvePick", charId: me, cardId: c.id }) }))));
  }
  return null;
}

// ---- The check ----

// The slim bar that stays at the top: goal, score, and the effects waiting on your next card.
function hud(p, ck) {
  const need = p.target != null ? p.target - p.total : null;
  return h("div", { class: "hud" },
    h("div", { class: "hud-top" }, h("span", { class: "hud-goal", "data-tip": p.goal || undefined }, p.survival ? "Survive" : p.goal || (p.approach ? "Goal spoken at the table" : "Your goal")),
      h("span", { class: "hud-score" }, p.total, h("small", {}, ` / ${p.target ?? "?"}`))),
    need != null ? h("div", { class: `bar${need < 0 ? " over" : ""}` }, h("span", { style: `width:${Math.min(100, (100 * p.total) / Math.max(1, p.target))}%` })) : null,
    h("div", { class: "chips" },
      need != null ? h("span", { class: `pill ${need < 0 ? "bad" : need === 0 ? "good" : ""}`, "data-tip": need < 0 ? "Over your target: a bust, unless an adjustment brings you back." : need === 0 ? "Exactly on target: a critical. Winning more would bust you." : "Points still needed. Exactly is a critical; 1–3 short a success; 4–6 a partial." }, need < 0 ? `Over by ${-need}` : need === 0 ? "On target" : `Need ${need}`) : null,
      p.approach ? h("span", { class: `pill solid ${tone(p.approach)}`, "data-tip": "Your goal's suit. Cards in it can win any trick, not only ones in the world card's suit." }, `Trump ${SUITS[p.approach].sym} ${SUITS[p.approach].name}`) : null,
      p.brace ? h("span", { class: "pill good", "data-tip": consolationText("S") }, `Brace +${p.brace}`) : null,
      p.mirror ? h("span", { class: "pill good", "data-tip": consolationText("W") }, "Mirror") : null,
      p.boost ? h("span", { class: "pill good", "data-tip": "The GM's adjustment to your next card, for beating." }, `Next ${p.boost > 0 ? "+" : ""}${p.boost}`) : null,
      ck.phase === "setup" ? h("span", { class: "pill" }, `${ck.kind} check · ${ck.tricks} tricks`) : null));
}

// Left-to-right bots play with their hands face up: everyone can plan around them.
function openHands(ck, names) {
  const open = ck.participants.filter((id) => ck.players[id].openHand && ck.players[id].openHand.length);
  if (!open.length) return null;
  return open.map((id) => h("div", { class: "open-hand" }, h("div", { class: "small", "data-tip": "A left-to-right bot: it plays its leftmost legal card each trick, so you can see what's coming." }, h("strong", {}, names[id]), " plays left to right"),
    h("div", { class: "row" }, ck.players[id].openHand.map((c, i) => cardFace(c, "sm", { class: i === 0 ? "next-up" : "" })))));
}

// The world: the card in play on stage, the rest of the row beside it.
function stage(ck) {
  const live = ck.phase !== "resolve";
  const cur = live ? ck.worldRow[ck.trick] : null;
  return h("div", { class: "stage" },
    cur ? h("div", { class: "stage-card" }, h("span", { class: "stage-label" }, `Trick ${ck.trick + 1} of ${ck.tricks}`), cardFace(cur, "stage", { class: "current" }),
      cur.beat != null ? h("span", { class: "small", "data-tip": "The GM changed what it takes to beat this card. It still scores its printed value." }, `counts ${cur.beat} to beat`) : null)
      : h("div", { class: "stage-card" }, h("span", { class: "stage-label" }, "All tricks played")),
    h("div", {}, h("div", { class: "stage-label" }, live ? "Still to come" : "The world row"),
      // While a check runs, only the cards still to come; afterwards, the whole row.
      live && ck.trick >= ck.worldRow.length - 1 ? h("div", { class: "small muted" }, "This is the last trick.")
        : h("div", { class: "strip" }, (live ? ck.worldRow.slice(ck.trick + 1) : ck.worldRow).map((c) => cardFace(c, "sm")))));
}

function checkView(view, info, me) {
  const ck = view.check;
  const p = ck.players[me];
  const names = Object.fromEntries(Object.values(view.characters).map((c) => [c.id, c.name]));
  const w = ck.worldRow[ck.trick];
  const out = [hud(p, ck)];

  if (ck.phase !== "setup") out.push(stage(ck));

  if (ck.phase === "setup") {
    const goal = p.survival ? null : h("textarea", { class: "textarea-full", "data-key": "goal-text", rows: 3, placeholder: "Optional, e.g. Shoulder the gate shut before the bell", maxlength: 100, "aria-label": "What you're doing, and how" }, p.goal || "");
    const suitDefault = p.approach || view.characters[me].primary;
    const suit = suitChoice("appr-suit", suitDefault, null, "Trump", { tip: (k) => (k === view.characters[me].primary ? "Your primary suit." : undefined) });
    const start = p.suggested ?? (ck.kind === "standard" ? 10 : 6);
    const hint = h("div", { class: "small", "aria-live": "polite" }, difficultyHint(ck.kind, Number(draft("suggest") ?? start)));
    const hard = p.survival ? null : h("input", { type: "number", "data-key": "suggest", min: 1, max: 40, step: 1, inputmode: "numeric", value: start, "aria-label": "Your suggested target",
      oninput: (e) => { hint.textContent = difficultyHint(ck.kind, Number(e.target.value)); } });
    out.push(h("div", { class: "panel stack" }, h("h2", {}, "Your goal"),
      p.survival ? h("p", { class: "pill bad" }, `Your goal is forced: survive. Target ${p.target}.`)
        : h("label", {}, h("h3", {}, "What are you doing, and how?"), h("div", { class: "small muted" }, "Optional: leave it blank if you've said it at the table or it's obvious. The GM sets the difficulty from it."), goal),
      h("div", {}, h("h3", {}, "Which suit does it use?"), h("div", { class: "small muted mb" }, "Whichever the goal leans on. It's your trump for this check."), suit),
      hard ? h("label", {}, h("h3", {}, "What target do you suggest?"), h("div", { class: "small muted" }, `The total you'll aim to hit. ${ck.kind === "standard" ? "Standard checks run 6–20." : "This check runs 6–12."} The GM has the final say.`), h("div", { class: "row" }, hard), hint) : null,
      h("button", { class: "primary big", onclick: () => {
        const g = goal ? goal.value.trim() : undefined;
        const n = hard ? Number(hard.value) : undefined;
        if (hard && (!Number.isInteger(n) || n < 1 || n > 40)) return toast("Suggest a target from 1 to 40.");
        act({ type: "declareApproach", charId: me, suit: picked("appr-suit", suitDefault), goal: g, suggested: n });
      } }, p.approach ? "Update" : "Declare"),
      p.approach ? h("p", { class: `pill ${p.approved ? "good" : "warn"}` }, p.approved ? `Target ${p.target}${p.survival ? "" : ", set by the GM"}` : "Waiting for the GM to set the target") : null));
  }

  for (const pr of view.prompts || []) out.push(promptPanel(pr, view, me));

  // Who's still choosing.
  if (ck.phase === "play" && w) out.push(h("div", { class: "panel" }, h("div", { class: "stage-label mb" }, "This trick"),
    choosingList(ck, names, me),
    openHands(ck, names)));

  const blessed = (view.hand || []).find((c) => c.blessed);
  const nobodyLocked = ck.participants.every((id) => !ck.players[id].locked);
  if (blessed && ck.participants.length > 1 && (ck.phase === "consolation" || (ck.phase === "play" && nobodyLocked))) {
    const to = h("select", { "data-key": "bless-to", "aria-label": "Give to" }, ck.participants.filter((id) => id !== me).map((id) => h("option", { value: id }, names[id])));
    out.push(h("div", { class: "panel row" }, h("span", { "data-tip": cardText(blessed) }, "Give your Blessed to"), to, h("button", { onclick: () => act({ type: "giveBlessed", charId: me, to: to.value, cardId: blessed.id }) }, "Give"), h("span", { class: "small muted" }, "You draw a card.")));
  }

  if (ck.results) {
    const r = ck.results[me];
    out.push(h("div", { class: `panel banner res-banner res-${r.result} stack` }, h("h2", { class: `res-text res-${r.result}` }, RESULT[r.result]), h("p", { class: "big" }, `${r.tally} of ${r.target}`), h("p", {}, RESULT_NOTE[r.result]),
      r.dies ? h("p", {}, h("strong", {}, "You do not survive.")) : null, h("p", { class: "small muted" }, "The GM narrates what happens and any consequences.")));
  }
  if (p.tally.length) out.push(h("div", { class: "panel" }, h("div", { class: "stage-label" }, "Won so far"), h("div", { class: "row mt" },
    p.tally.map((t) => t.adjustment ? h("span", { class: "pill", "data-tip": t.reason || "A GM adjustment." }, `${t.score > 0 ? "+" : ""}${t.score}`) : cardFace(t.card, "sm")))));
  out.push(trickLog(ck.log, names));

  // The hand, docked at the bottom where your thumb is.
  if (ck.phase === "play" && w) {
    const waiting = ck.participants.filter((id) => !ck.players[id].locked && id !== me && ck.players[id].handCount).map((id) => names[id]);
    if (view.myLock) {
      const c = view.hand.find((x) => x.id === view.myLock.cardId);
      out.push(h("div", { class: "dock" }, h("div", { class: "locked-row" }, cardFace(c, "lg", { class: "chosen" }), h("div", { class: "stack" },
        h("strong", {}, `Locked in: ${c ? c.label : ""}`), h("div", { class: "small muted" }, waiting.length ? `Waiting for ${waiting.join(", ")}.` : "Revealing…"),
        h("button", { class: "small", onclick: () => act({ type: "unlockCard", charId: me }) }, "Change my card")))));
    } else {
      out.push(h("div", { class: "dock" }, handDock({ hand: view.hand, legal: view.legal, p, w, ui,
        onLock: (cardId, priceCardId) => act({ type: "lockCard", charId: me, cardId, priceCardId }) })));
    }
  } else if (ck.phase !== "setup" && view.hand && view.hand.length && ck.phase !== "resolve" && !(view.prompts || []).some((x) => x.type === "recalculate")) {
    out.push(h("div", { class: "dock" }, h("p", { class: "hint" }, "Your hand. The next trick starts when everyone's ready."), h("div", { class: "fan" }, view.hand.map((c) => cardFace(c, "md")))));
  }
  return out;
}

// Hands read best sorted: suit by suit, low to high, statuses and Blessed last.
const ORDER = { S: 0, D: 1, I: 2, W: 3 };
const sortCards = (cards) => [...cards].sort((a, b) => (a.blessed - b.blessed) || (a.status - b.status) || ((ORDER[a.suit] ?? 9) - (ORDER[b.suit] ?? 9)) || a.v - b.v);

function draw() {
  if (!last) return;
  if (last.view.hand) last.view.hand = sortCards(last.view.hand);
  const { room: info, view } = last;
  header.setTitle(info.name);
  const me = info.you.charId;
  if (!me || ui.creating) return render(main, createForm(info.you));
  const ch = view.characters[me];
  const ck = view.check;
  const inCheck = ck && ck.phase !== "closed" && ck.players[me];
  const tabs = h("div", { class: "tabs small-tabs" },
    h("button", { class: "small", "aria-pressed": String(tab === "play"), onclick: () => { tab = "play"; draw(); } }, inCheck ? "The check" : "Table"),
    h("button", { class: "small", "aria-pressed": String(tab === "cards"), onclick: () => { tab = "cards"; draw(); } }, "My cards"),
    h("button", { class: "small", "aria-pressed": String(tab === "history"), onclick: () => { tab = "history"; draw(); } }, "History"));
  const parts = [tabs];
  if (ch.alive && ch.retired) parts.push(h("div", { class: "panel banner warn stack" }, h("h2", {}, `${ch.name} is retired`), h("p", {}, "The GM has retired this character. Make a new one, switch to another in My cards, or ask the GM to bring them back."),
    h("button", { class: "primary", onclick: () => { ui.creating = true; draw(); } }, "Make a new character")));
  if (!ch.alive) parts.push(h("div", { class: "panel banner bad stack" }, h("h2", {}, `${ch.name} is dead`), h("p", {}, "Make a new character, or ask the GM to bring them back."),
    h("button", { class: "primary", onclick: () => { ui.creating = true; draw(); } }, "Make a new character")));
  if (tab === "cards") parts.push(charactersPanel(info, view, me, !!inCheck), sheet(view, me));
  else if (tab === "history") parts.push(...historyPanel(view, { items: ITEM_NAMES, notes: notes.current(), seats: info.seats }));
  else if (!inCheck) {
    parts.push(h("div", { class: "panel stack" }, h("h2", {}, ck && ck.phase !== "closed" ? "You're not in this check" : "Waiting for the GM"),
      h("p", { class: "muted" }, "Talk the scene through. When the GM starts a check, it appears here."),
      ch.survival ? h("p", { class: "pill bad" }, `Your next check is survival, target ${ch.survival.target}.`) : null));
    if (view.history.length) {
      const h0 = view.history[view.history.length - 1];
      if (h0.results[me]) parts.push(h("div", { class: "panel small row" }, "Last check:", resultPill(h0.results[me].result), `${h0.results[me].tally} of ${h0.results[me].target}`));
    }
  } else {
    // In a check the score bar goes first, above the tabs, so it can stay pinned at the top.
    const [bar, ...rest] = checkView(view, info, me);
    parts.unshift(bar);
    parts.push(...rest);
  }
  render(main, parts);
}

start();
</script>
