<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trinket Card Back</title>
<link rel="stylesheet" href="../card_base.css" />
<style>
  /* Trinket back: a catalogue plate. Relics keep their Price card on the back instead. */
  .item-back {
    --ink: #1b1917;
    --mark: #5a3a22;
    --paper: color-mix(in srgb, var(--mark) 10%, #f1ece1);
    padding: 0;
    border: 0;
    border-radius: 13px;
    background: var(--paper);
    box-shadow: inset 0 0 0 var(--print-band) #fff, 0 12px 34px rgba(18, 24, 20, 0.22);
  }

  .item-back::before {
    inset: var(--print-band);
    border: 12px double var(--ink);
    background: none;
    opacity: 1;
  }

  .item-back::after {
    content: none;
  }

  /* engraved field */
  .item-back__field {
    position: absolute;
    inset: calc(var(--print-band) + 40px);
    border: 2.3px solid var(--ink);
    background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--ink) 10%, transparent) 0 2px, transparent 2px 14px);
  }

  .item-back__plate {
    position: absolute;
    left: 50%;
    top: 50%;
    display: grid;
    place-items: center;
    width: 600px;
    height: 600px;
    border: 12px double var(--ink);
    background: color-mix(in srgb, var(--paper) 60%, #fff);
    box-shadow: 0 0 0 18px var(--paper), 0 0 0 20.5px var(--ink);
    color: var(--mark);
    transform: translate(-50%, -50%);
  }

  .item-back__plate svg {
    display: block;
    width: 320px;
    height: 320px;
  }
</style>
</head>
<body>
  <div class="card-preview">
    <div class="card item-back" aria-label="Trinket card back">
      <div class="item-back__field"></div>
      <div class="item-back__plate" id="item-back-mark"></div>
    </div>
  </div>
  <script src="../suit_icons.js"></script>
  <script>
    document.getElementById("item-back-mark").innerHTML = globalThis.TrickSuitIcons.svg("trinket");
    if (new URLSearchParams(window.location.search).get("export") === "1") {
      document.body.classList.add("export-page");
    }
  </script>
</body>
</html>
