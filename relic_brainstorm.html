<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relic Brainstorm: Black Valley</title>
    <style>
        :root {
            --paper: #efe4cf;
            --paper-shadow: #dcc9ab;
            --ink: #2f2419;
            --muted: #665746;
            --pine: #40543e;
            --clay: #8a4f37;
            --gold: #a57c2f;
            --line: rgba(47, 36, 25, 0.18);
            --panel: rgba(255, 250, 240, 0.72);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top, rgba(255, 248, 233, 0.82), transparent 38%),
                linear-gradient(180deg, #6e8362 0%, #4f6049 22%, #7a624b 22.5%, #664d39 100%);
            min-height: 100vh;
        }

        .page {
            width: min(980px, calc(100% - 32px));
            margin: 32px auto;
            padding: 32px;
            background: var(--paper);
            border: 1px solid var(--paper-shadow);
            box-shadow: 0 18px 50px rgba(26, 18, 12, 0.28);
            position: relative;
        }

        .page::before {
            content: "";
            position: absolute;
            inset: 12px;
            border: 1px solid rgba(101, 77, 51, 0.18);
            pointer-events: none;
        }

        header {
            padding-bottom: 20px;
            border-bottom: 2px solid var(--pine);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--clay);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            font-size: 0.82rem;
            font-weight: bold;
        }

        h1,
        h2,
        h3 {
            margin: 0;
            font-weight: 600;
            line-height: 1.1;
        }

        h1 {
            font-size: clamp(2.1rem, 4vw, 3.1rem);
        }

        h2 {
            margin-bottom: 14px;
            font-size: 1.4rem;
            color: var(--pine);
        }

        h3 {
            margin-bottom: 10px;
            color: var(--clay);
            font-size: 1.2rem;
        }

        p {
            margin: 0;
            line-height: 1.65;
            font-size: 1.03rem;
        }

        p + p {
            margin-top: 12px;
        }

        .lede {
            margin-top: 16px;
            max-width: 50rem;
            color: var(--muted);
        }

        .section {
            margin-top: 28px;
        }

        .spotlight {
            padding: 20px;
            background: #f7efdf;
            border: 1px solid var(--line);
            border-left: 6px solid var(--clay);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 18px;
        }

        .card {
            padding: 20px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-top: 4px solid var(--gold);
        }

        .tag {
            display: inline-block;
            margin-bottom: 10px;
            padding: 4px 8px;
            border: 1px solid var(--line);
            color: var(--pine);
            background: rgba(255, 255, 255, 0.45);
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        ul {
            margin: 12px 0 0;
            padding-left: 20px;
            line-height: 1.6;
        }

        li + li {
            margin-top: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 14px;
            background: rgba(255, 255, 255, 0.38);
        }

        th,
        td {
            border: 1px solid var(--line);
            padding: 10px;
            vertical-align: top;
            text-align: left;
            line-height: 1.5;
        }

        th {
            background: rgba(64, 84, 62, 0.12);
            color: var(--pine);
        }

        .placeholder {
            color: var(--muted);
            font-style: italic;
        }

        @media (max-width: 640px) {
            .page {
                width: calc(100% - 20px);
                margin: 10px auto;
                padding: 20px;
            }
        }
    </style>
</head>
<body><main class="page"><h1>Black Valley items</h1><p>The current item text is maintained in <a href="items/item_catalog.js">items/item_catalog.js</a> and displayed in the <a href="index.html">card gallery</a>.</p><p>See <a href="items/README.md">item conventions</a> for use with group checks. The earlier brainstorm is preserved in <a href="docs/history/before_player_guide/relic_brainstorm.html">the history archive</a>.</p><p><a href="rules.html">Rules</a> · <a href="rules.html">Full rules</a></p></main></body>
</html>
