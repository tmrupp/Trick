<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Strength Card</title>
<script src="./card_rules.js"></script>
<script>
  const CARD_VARIANT_CONFIG = {

      "--card-bg-bottom": "#ffffff",
